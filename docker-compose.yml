# Local development only. Every published port is bound to 127.0.0.1 so the
# stack is reachable from this machine only. Not a remote/production deployment.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobflow}
      POSTGRES_USER: ${POSTGRES_USER:-jobflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobflow} -d ${POSTGRES_DB:-jobflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobflow}
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_PROXY_TARGET: http://backend:3001
    ports:
      # Vite listens on 0.0.0.0 inside the container (required for Docker port
      # forwarding); the host side is restricted to localhost here.
      - "127.0.0.1:5173:5173"

volumes:
  postgres_data:
